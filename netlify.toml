# Netlify — primary host for Nova Home Decor CMS
# Site settings:
#   Build command: npm run build  (= next build)
#   Publish directory: leave blank (@netlify/plugin-nextjs owns output)
#   Node version: 20
# Do NOT set DEV_AUTH_ENABLED in production.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  # Public defaults (override NEXT_PUBLIC_APP_URL in Netlify UI to your real site URL)
  NEXT_PUBLIC_SUPABASE_URL = "https://zfsoeketfjnnpirglosq.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpmc29la2V0ZmpubnBpcmdsb3NxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NjI1NjAsImV4cCI6MjA5OTUzODU2MH0.1bpzOD3aOGz88h-C_pPtUopWPcMYW3b2OxR2t-ioc40"
  NEXT_PUBLIC_DEFAULT_LOCALE = "ku"
  SUPER_ADMIN_EMAIL = "novahome756@gmail.com"
  RESEND_FROM_EMAIL = "Nova Home Decor <onboarding@resend.dev>"

# Secrets — set only in Netlify UI (Site configuration → Environment variables):
#   SUPABASE_SERVICE_ROLE_KEY
#   RESEND_API_KEY
#   GEMINI_API_KEY
#   OTP_PEPPER
#   HEALTH_CHECK_SECRET
#   NEXT_PUBLIC_APP_URL=https://YOUR-SITE.netlify.app
#   NEXT_PUBLIC_GOOGLE_MAPS_API_KEY (optional)
# Scopes: Builds + Functions (Production + Deploy Previews)
# Do NOT set DEV_AUTH_ENABLED in production.

[[plugins]]
  package = "@netlify/plugin-nextjs"
