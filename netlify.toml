# Netlify — Next.js (OpenNext runtime via @netlify/plugin-nextjs)
# Leave Publish directory blank in the Netlify UI if asked; the plugin owns output.
# Do NOT set DEV_AUTH_ENABLED in production.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
